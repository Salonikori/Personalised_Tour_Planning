services:
  db:
    image: postgres:16-alpine
    container_name: voyara-ps7-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: voyara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - voyara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voyara"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  voyara_postgres_data:
